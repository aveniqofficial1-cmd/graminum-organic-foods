    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDIouI6K5CYZAjVPde1Yvus3PIek6d8D4U
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: graminum-organic-foods.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: graminum-organic-foods
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: graminum-organic-foods.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "530118920285"
      - key: VITE_FIREBASE_APP_ID
        value: 1:530118920285:web:2327341d638878d11d25b4
